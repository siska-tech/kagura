name: MicroPython driver and console
# Pull requests and pushes to main run only the jobs that the changed files
# need (tools/ci-changes.sh); manual and weekly scheduled runs run them all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      micropython: ${{ steps.filter.outputs.micropython }}
      micropython_firmware: ${{ steps.filter.outputs.micropython_firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check the change filter
        run: bash tools/test-ci-changes.sh
      - name: Select jobs for the changed files
        id: filter
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Explicit bash adds pipefail, so a filter error fails the step.
        shell: bash
        run: bash tools/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
  driver:
    needs: changes
    if: needs.changes.outputs.micropython == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MicroPython
        run: |
          git clone --depth 1 --branch v1.26.0 https://github.com/micropython/micropython.git build/micropython-src
          test "$(git -C build/micropython-src rev-parse HEAD)" = 4ce2dd2cdab6e57f3982fc899f15a2103d71b0be
      - name: Check generated constants
        shell: pwsh
        run: ./tools/gen-registers.ps1 -Check
      - name: Driver, terminal and actual PIO assembly/timing tests
        run: python3 -I software/micropython/tests/test_driver.py --rp2 build/micropython-src/ports/rp2/modules/rp2.py
      - name: Japanese text tests and font regeneration
        run: |
          curl -fsSL -o build/misaki_bdf_2021-05-05.zip https://littlelimit.net/arc/misaki/misaki_bdf_2021-05-05.zip
          MISAKI_ZIP=build/misaki_bdf_2021-05-05.zip python3 -I software/micropython/tests/test_kagura_ja.py
      - name: Check MicroPython bytecode compilation
        run: |
          make -C build/micropython-src/mpy-cross -j4
          mkdir -p build/mpy
          for file in software/micropython/kagura/*.py software/micropython/kagura_ja/*.py software/micropython/examples/*.py; do
            build/micropython-src/mpy-cross/build/mpy-cross -o "build/mpy/$(basename "$(dirname "$file")")-$(basename "$file").mpy" "$file"
          done
  firmware:
    needs: changes
    if: needs.changes.outputs.micropython_firmware == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [KAGURA_PICO, KAGURA_PICO_W]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and pinned MicroPython
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
          git clone --depth 1 --branch v1.26.0 https://github.com/micropython/micropython.git build/micropython-src
          test "$(git -C build/micropython-src rev-parse HEAD)" = 4ce2dd2cdab6e57f3982fc899f15a2103d71b0be
          make -C build/micropython-src/ports/rp2 BOARD=${{ matrix.board }} \
            BOARD_DIR="$GITHUB_WORKSPACE/software/micropython/boards/${{ matrix.board }}" submodules
          make -C build/micropython-src/mpy-cross -j4
      - name: Build USB + dupterm firmware
        run: |
          make -C build/micropython-src/ports/rp2 BOARD=${{ matrix.board }} \
            BOARD_DIR="$GITHUB_WORKSPACE/software/micropython/boards/${{ matrix.board }}" -j4
      - uses: actions/upload-artifact@v4
        with:
          name: micropython-${{ matrix.board }}
          path: |
            build/micropython-src/ports/rp2/build-${{ matrix.board }}/firmware.uf2
            software/micropython/kagura/*.py
            software/micropython/kagura_ja/*.py
            software/micropython/fonts/*
            software/micropython/examples/*.py
  # Always reports, so it can be the required check: skipped jobs pass,
  # failed or cancelled ones (including the filter) fail it.
  result:
    name: MicroPython result
    if: always()
    needs: [changes, driver, firmware]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes driver firmware: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
