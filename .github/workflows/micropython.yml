name: MicroPython driver and console
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  driver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned MicroPython
        run: |
          git clone --depth 1 --branch v1.26.0 https://github.com/micropython/micropython.git build/micropython-src
          test "$(git -C build/micropython-src rev-parse HEAD)" = 4ce2dd2cdab6e57f3982fc899f15a2103d71b0be
      - name: Check generated constants
        shell: pwsh
        run: ./tools/gen-registers.ps1 -Check
      - name: Driver, terminal and actual PIO assembly/timing tests
        run: python3 -I software/micropython/tests/test_driver.py --rp2 build/micropython-src/ports/rp2/modules/rp2.py
      - name: Check MicroPython bytecode compilation
        run: |
          make -C build/micropython-src/mpy-cross -j4
          mkdir -p build/mpy
          for file in software/micropython/kagura/*.py software/micropython/examples/*.py; do
            build/micropython-src/mpy-cross/build/mpy-cross -o "build/mpy/$(basename "$file").mpy" "$file"
          done
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        board: [KAGURA_PICO, KAGURA_PICO_W]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and pinned MicroPython
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake
          git clone --depth 1 --branch v1.26.0 https://github.com/micropython/micropython.git build/micropython-src
          test "$(git -C build/micropython-src rev-parse HEAD)" = 4ce2dd2cdab6e57f3982fc899f15a2103d71b0be
          make -C build/micropython-src/ports/rp2 BOARD=${{ matrix.board }} \
            BOARD_DIR="$GITHUB_WORKSPACE/software/micropython/boards/${{ matrix.board }}" submodules
          make -C build/micropython-src/mpy-cross -j4
      - name: Build USB + dupterm firmware
        run: |
          make -C build/micropython-src/ports/rp2 BOARD=${{ matrix.board }} \
            BOARD_DIR="$GITHUB_WORKSPACE/software/micropython/boards/${{ matrix.board }}" -j4
      - uses: actions/upload-artifact@v4
        with:
          name: micropython-${{ matrix.board }}
          path: |
            build/micropython-src/ports/rp2/build-${{ matrix.board }}/firmware.uf2
            software/micropython/kagura/*.py
            software/micropython/examples/*.py
