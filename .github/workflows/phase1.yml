name: Phase 1 RTL sources
# Pull requests and pushes to main run only the jobs that the changed files
# need (tools/ci-changes.sh); manual and weekly scheduled runs run them all.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 JST
  workflow_dispatch:
    inputs:
      force_fail:
        description: Testbench top to report as failed (checks failure artifacts)
        required: false
        default: ''
      trace:
        description: Space-separated testbench tops to dump as VCD
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # Commit of tag v5.032; tools/verilator.version holds the version string.
  VERILATOR_COMMIT: 8ff77e9d47351b0a59114929880687839a51840b
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      verilator: ${{ steps.filter.outputs.verilator }}
      rtl_sources: ${{ steps.filter.outputs.rtl_sources }}
      pico: ${{ steps.filter.outputs.pico }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Check the change filter
        run: bash tools/test-ci-changes.sh
      - name: Select jobs for the changed files
        id: filter
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        # Explicit bash adds pipefail, so a filter error fails the step.
        shell: bash
        run: bash tools/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
  verilator-simulation:
    needs: changes
    if: needs.changes.outputs.verilator == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Verilator version
        id: verilator
        run: echo "version=$(tr -d '[:space:]' < tools/verilator.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/verilator
          key: verilator-${{ steps.verilator.outputs.version }}-${{ env.VERILATOR_COMMIT }}-ubuntu-24.04
      - name: Build Verilator from the pinned commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex bison libfl2 libfl-dev zlib1g-dev
          git clone --depth 1 --branch "v${{ steps.verilator.outputs.version }}" https://github.com/verilator/verilator.git /tmp/verilator-src
          test "$(git -C /tmp/verilator-src rev-parse HEAD)" = "$VERILATOR_COMMIT"
          cd /tmp/verilator-src
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install
      - run: echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
      - name: Run native SystemVerilog tests with Verilator
        env:
          KAGURA_STRICT_VERSION: 1
          KAGURA_SEED: 1
          KAGURA_TEST_TIMEOUT: 1800
          KAGURA_FORCE_FAIL: ${{ inputs.force_fail }}
          KAGURA_TRACE: ${{ inputs.trace }}
        run: bash tools/test-verilator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verilator-results
          if-no-files-found: warn
          path: |
            build/verilator/*.log
            build/verilator/*.tsv
            build/verilator/*.ppm
            build/verilator/*.raw
            build/verilator/*.wav
            build/verilator/*.vcd
  source-simulation:
    needs: changes
    if: needs.changes.outputs.rtl_sources == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog cc65
      - name: Compile and assemble the generated register headers
        env:
          KAGURA_REQUIRE_CA65: 1
        run: bash tools/test-headers.sh
      - name: Verify pinned dependency hashes
        shell: pwsh
        run: ./tools/check-dependencies.ps1
      - name: Compile and run source RTL test
        shell: pwsh
        run: ./tools/test-phase1.ps1
  pico-firmware:
    needs: changes
    if: needs.changes.outputs.pico == 'true'
    runs-on: ubuntu-24.04
    env:
      ARM_TOOLCHAIN: arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi
      ARM_TOOLCHAIN_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823
      PICO_SDK_TAG: 2.2.0
      PICO_SDK_COMMIT: a1438dff1d38bd9c65dbd693f0e5db4b9ae91779
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/opt
          key: pico-${{ env.ARM_TOOLCHAIN }}-${{ env.PICO_SDK_COMMIT }}
      - name: Install the Arm toolchain and Pico SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/opt
          curl -fsSL -o /tmp/arm.tar.xz "https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/$ARM_TOOLCHAIN.tar.xz"
          echo "$ARM_TOOLCHAIN_SHA256  /tmp/arm.tar.xz" | sha256sum -c
          tar -xf /tmp/arm.tar.xz -C ~/opt
          git clone --depth 1 --branch "$PICO_SDK_TAG" https://github.com/raspberrypi/pico-sdk.git ~/opt/pico-sdk
          test "$(git -C ~/opt/pico-sdk rev-parse HEAD)" = "$PICO_SDK_COMMIT"
          git -C ~/opt/pico-sdk submodule update --init --depth 1 lib/tinyusb lib/cyw43-driver
      - name: Build the host firmware
        run: |
          export PATH="$HOME/opt/$ARM_TOOLCHAIN/bin:$PATH" PICO_SDK_PATH="$HOME/opt/pico-sdk"
          cmp software/pico/pico_sdk_import.cmake "$PICO_SDK_PATH/external/pico_sdk_import.cmake"
          cmake -S software/pico -B build/pico -DCMAKE_BUILD_TYPE=Release
          cmake --build build/pico -j"$(nproc)"
      - name: Check PIO timing against the adapter model
        run: python3 -I software/pico/tests/test_pio_timing.py build/pico/kagura_host.pio.h
      - uses: actions/upload-artifact@v4
        with:
          name: pico-firmware
          path: |
            build/pico/kagura_host.uf2
            build/pico/kagura_host.elf
  # Always reports, so it can be the required check: skipped jobs pass,
  # failed or cancelled ones (including the filter) fail it.
  result:
    name: Phase 1 result
    if: always()
    needs: [changes, verilator-simulation, source-simulation, pico-firmware]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes verilator-simulation source-simulation pico-firmware: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
