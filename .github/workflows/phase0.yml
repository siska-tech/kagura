name: Phase 0 design consistency
# Runs on every change: the link check reads every Markdown file, and it
# takes well under a minute.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  design-documents:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check design arithmetic and documentation
        shell: pwsh
        run: ./tools/check-design.ps1
      - name: Check register spec, generated constants and document tables
        shell: pwsh
        run: ./tools/gen-registers.ps1 -Check
